[workspace]
resolver = "3"
members = [
  "crates/kelmo-wire",
  "crates/kelmo-runtime",
  "crates/kelmo-embed",
  "crates/kelmo-archive",
  "crates/kelmod",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/dazaronak/kelmo"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
libc = "0.2"
# Pinned to the version of the Python `tokenizers` package in pyproject.toml, so counts are identical.
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "process", "signal", "macros"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
