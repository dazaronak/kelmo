[package]
name = "kelmod"
description = "The Kelmo daemon: supervisor, gateway and router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kelmod"
path = "src/main.rs"

[dependencies]
kelmo-wire = { path = "../kelmo-wire" }
kelmo-runtime = { path = "../kelmo-runtime" }
kelmo-embed = { path = "../kelmo-embed" }
kelmo-archive = { path = "../kelmo-archive" }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
# Already in the tree through rmcp and hyper; named here, at the locked versions, for the response and
# cancellation types the endpoint builds itself.
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = { version = "=0.1.5", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }
tower-service = { version = "=0.3.3", default-features = false }

[lints]
workspace = true
