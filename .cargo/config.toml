# macOS links through the system compiler driver by absolute path: a `cc` earlier on PATH need not be a
# C compiler, and cargo would link with whatever it finds there.
[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[target.x86_64-apple-darwin]
linker = "/usr/bin/cc"

# The same for C code built by dependencies (the tokenizer's regex library): build scripts call the `cc` crate,
# which runs `cc` from PATH unless a CC variable names a compiler. Cargo has no per-target [env], so the
# compiler is named through the target-specific variables the `cc` crate reads first. Other targets keep
# their own default: Linux build images such as manylinux have `cc` on PATH but no /usr/bin/cc.
[env]
CC_aarch64_apple_darwin = { value = "/usr/bin/cc", force = false }
CXX_aarch64_apple_darwin = { value = "/usr/bin/c++", force = false }
CC_x86_64_apple_darwin = { value = "/usr/bin/cc", force = false }
CXX_x86_64_apple_darwin = { value = "/usr/bin/c++", force = false }
