[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "kelmo"
version = "0.2.0"
description = "Long-term memory for coding agents: a searchable archive, a self-maintained wiki and a startup context"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Dzmitry Azaronak" }]
keywords = ["memory", "coding-agents", "mcp", "claude-code", "codex", "wiki", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastmcp>=3.0,<4",
  "sqlite-vec>=0.1.7,<0.2",
  "fastembed>=0.4,<1",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "python-frontmatter>=1.1,<2",
  "markdown-it-py>=4,<5",
  "pyyaml>=6,<7",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<1",
]

[project.urls]
Homepage = "https://github.com/dazaronak/kelmo"
Documentation = "https://github.com/dazaronak/kelmo/tree/main/docs"
Issues = "https://github.com/dazaronak/kelmo/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

# One wheel per platform: the Python package from src/kelmo plus the kelmod binary. The launcher and
# the runtime files the launcher reads install from packaging/wheel-data, whose entries link to their
# single source in packaging/ and src/kelmo.
[tool.maturin]
bindings = "bin"
manifest-path = "rust/crates/kelmod/Cargo.toml"
python-source = "src"
module-name = "kelmo"
data = "packaging/wheel-data"
locked = true
strip = true
include = [
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "packaging/**/*", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "_docs/**", "rust/target/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

# The rules this code is written against; a newer ruff's wider default set is not the contract.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
build-constraint-dependencies = [
  "maturin==1.15.0",
]
